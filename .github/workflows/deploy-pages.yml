name: Deploy Frontend to GitHub Pages
run-name: Deploy ${{ inputs.branch || github.ref_name }} to [${{ inputs.environment || 'dev' }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      branch:
        description: "Branch to deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Docker and Deploy
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with Auto-Injected Secrets
        env:
          ADMIN_UI_URL: ${{ secrets.ADMIN_UI_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          # 1. Generate a .env file containing all environment variables loaded into the runner
          env | grep -vE '^(PATH|HOME|USER|GITHUB_|RUNNER_|DEBIAN_)' > .env

          # 2. Append repository base path
          echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> .env

          # 3. Pass .env to Docker secret mount
          docker build --secret id=env,src=.env -t events-planner-web:github-pages .

      - name: Extract build files from Docker container
        run: |
          mkdir -p ./dist
          CONTAINER_ID=$(docker create events-planner-web:github-pages)
          docker cp $CONTAINER_ID:/usr/share/nginx/html/. ./dist/
          docker rm $CONTAINER_ID

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4