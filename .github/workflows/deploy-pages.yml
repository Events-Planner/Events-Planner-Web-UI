name: Deploy Frontend to GitHub Pages
run-name: Deploy ${{ inputs.branch || github.ref_name }} to [${{ inputs.environment || 'dev' }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      branch:
        description: "Branch to deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Docker and Deploy
    runs-on: ubuntu-latest

    # Dynamically loads secrets from the environment chosen during trigger (dev or prod)
    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with Enterprise Dynamic Secrets
        run: |
          # Automatically converts any loaded environment variable starting with VITE_ or ADMIN_ into a --build-arg
          BUILD_ARGS=$(env | grep -E '^VITE_|^ADMIN_' | xargs -I {} echo --build-arg {})
          
          docker build \
            --build-arg VITE_BASE_PATH=/${{ github.event.repository.name }}/ \
            $BUILD_ARGS \
            -t events-planner-web:github-pages .

      - name: Extract build files from Docker container
        run: |
          mkdir -p ./dist
          # Create temporary container and copy out built files
          CONTAINER_ID=$(docker create events-planner-web:github-pages)
          docker cp $CONTAINER_ID:/usr/share/nginx/html/. ./dist/
          docker rm $CONTAINER_ID

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4