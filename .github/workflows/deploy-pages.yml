name: Deploy Frontend to GitHub Pages
run-name: Deploy ${{ inputs.branch || github.ref_name }} to [${{ inputs.environment || 'dev' }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      branch:
        description: "Branch to deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Docker and Deploy
    runs-on: ubuntu-latest

    # Automatically loads secrets for whatever environment you select (dev, prod, staging, etc.)
    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with Dynamic Secret Injection
        # Converts the ENTIRE secrets object into Docker build arguments automatically
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          # Parse all secrets into --build-arg KEY="VALUE" automatically
          BUILD_ARGS=$(echo '$SECRETS_JSON' | jq -r 'to_entries[] | "--build-arg " + .key + "=\"" + .value + "\""' | tr '\n' ' ')
          
          docker build \
            --build-arg VITE_BASE_PATH=/${{ github.event.repository.name }}/ \
            $BUILD_ARGS \
            -t events-planner-web:github-pages .

      - name: Extract build files from Docker container
        run: |
          mkdir -p ./dist
          CONTAINER_ID=$(docker create events-planner-web:github-pages)
          docker cp $CONTAINER_ID:/usr/share/nginx/html/. ./dist/
          docker rm $CONTAINER_ID

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4