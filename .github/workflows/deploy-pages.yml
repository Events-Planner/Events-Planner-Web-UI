name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod

      branch:
        description: "Branch to deploy (leave blank for selected branch)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ inputs.branch || github.ref_name }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Validate deployment
        run: |
          TARGET_BRANCH="${{ inputs.branch || github.ref_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: $TARGET_BRANCH"

          if [ "${{ inputs.environment }}" = "prod" ] && [ "$TARGET_BRANCH" != "master" ]; then
            echo "ERROR: PROD can only be deployed from master."
            exit 1
          fi

          echo "Deployment configuration is valid."

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4