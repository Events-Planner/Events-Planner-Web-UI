name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

      branch:
        description: "Branch to deploy"
        required: true
        default: "dev"
        type: string

jobs:
  deploy:
    name: Build ${{ inputs.environment }} from ${{ inputs.branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment
        shell: bash
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: ${{ inputs.branch }}"

          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.branch }}" != "master" ]; then
            echo "❌ Production deployments are only allowed from master."
            exit 1
          fi

          echo "✅ Deployment configuration is valid."

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Deployment summary
        run: |
          echo "======================================"
          echo "Frontend build completed successfully"
          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: ${{ inputs.branch }}"
          echo "======================================"