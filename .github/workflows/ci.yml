name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod

      branch:
        description: "Branch to deploy (PROD must use master)"
        required: true
        type: string
        default: "master"

jobs:
  deploy:
    name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # Validate environment and branch
      # ---------------------------------------
      - name: Validate deployment
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: ${{ inputs.branch }}"

          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.branch }}" != "master" ]; then
            echo "❌ ERROR: PROD can only be deployed from master."
            exit 1
          fi

          echo "✅ Deployment configuration is valid."

      # ---------------------------------------
      # Checkout selected branch
      # ---------------------------------------
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # ---------------------------------------
      # Setup Node.js
      # ---------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------
      # Install dependencies
      # ---------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------
      # Lint
      # ---------------------------------------
      - name: Run lint
        run: npm run lint

      # ---------------------------------------
      # Build
      # ---------------------------------------
      - name: Build application
        run: npm run build

      # ---------------------------------------
      # Summary
      # ---------------------------------------
      - name: Deployment summary
        run: |
          echo "======================================"
          echo "Frontend deployment completed"
          echo "Environment : ${{ inputs.environment }}"
          echo "Branch      : ${{ inputs.branch }}"
          echo "======================================"