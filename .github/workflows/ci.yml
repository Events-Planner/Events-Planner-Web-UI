name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

      branch:
        description: "Branch to deploy"
        required: true
        default: "dev"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment
        run: |
          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.branch }}" != "master" ]; then
            echo "❌ PROD deployments are only allowed from master."
            exit 1
          fi

          echo "Environment: ${{ inputs.environment }}"
          echo "Branch: ${{ inputs.branch }}"

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build